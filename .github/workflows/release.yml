name: Release

# Canonical tag-triggered release automation is release-advanced.yml.
# This workflow is a manual fallback only — do not add push: tags here (race
# with release-advanced.yml produced empty release bodies on v0.3.27).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.3.44)'
        required: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Extract version from input
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Verify tag matches agtoosa.sh version
        run: |
          SCRIPT_VERSION=$(grep -oP 'AGTOOSA_VERSION="\K[^"]+' agtoosa.sh)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$SCRIPT_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match agtoosa.sh version ($SCRIPT_VERSION)"
            exit 1
          fi
          echo "✅ Version verified: $SCRIPT_VERSION"

      - name: Extract changelog for this release
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -n "/^## \\[$VERSION\\]/,/^## \\[/p" CHANGELOG.md | sed '1d;$d' | sed '/^---$/d' > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag_name }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.version.outputs.tag_name }}" \
              --title "AgToosa ${{ steps.version.outputs.version }}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "${{ steps.version.outputs.tag_name }}" \
              --title "AgToosa ${{ steps.version.outputs.version }}" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Update project status
        run: |
          echo "✅ Release v${{ steps.version.outputs.version }} published to GitHub"
