name: Setup GitHub Labels

on:
  workflow_dispatch:

jobs:
  create-labels:
    name: Create Standard GitHub Labels
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Sync labels from manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/github-labels-sync.sh --repo "${{ github.repository }}"
