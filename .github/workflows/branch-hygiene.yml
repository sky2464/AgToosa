name: Branch Hygiene (cursor/*)

# Deletes stale Cursor agent remote branches (cursor/*) that have no open PR.
# Default scheduled run does not close open PRs — only removes orphaned/closed-PR branches.
# Manual dispatch may set close_prs=true for the recovery path (DEV-133).

on:
  schedule:
    # Weekly Sunday 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      close_prs:
        description: "Close open PRs on matching cursor/* branches before delete"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "List only (no delete)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Dry-run listing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/cleanup-github-branches.sh --dry-run --prefix cursor/

      - name: Apply cleanup
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(--apply --prefix cursor/)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.close_prs }}" == "true" ]]; then
            args+=(--close-prs)
          fi
          bash scripts/cleanup-github-branches.sh "${args[@]}"
