name: AgToosa Issues Sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/Master-Plan.md'
      - 'Docs/Master-Plan.md'
  pull_request:
    paths:
      - 'docs/Master-Plan.md'
      - 'Docs/Master-Plan.md'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install bats
        run: |
          BATS_VERSION="v1.13.0"
          BATS_SHA256="a85e12b8828271a152b338ca8109aa23493b57950987c8e6dff97ba492772ff3"
          curl -sSL "https://github.com/bats-core/bats-core/archive/refs/tags/${BATS_VERSION}.tar.gz" -o bats.tar.gz
          echo "${BATS_SHA256}  bats.tar.gz" | sha256sum -c -
          tar -xzf bats.tar.gz
          sudo "./bats-core-${BATS_VERSION#v}/install.sh" /usr/local
          bats --version

      - name: GIP bats preflight
        run: bats tests/agtoosa.bats -f "GIP-"

      - name: Dry-run publish manifest
        run: bash scripts/agtoosa-issues-sync.sh --dry-run --path .

  sync-issues:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install bats
        run: |
          BATS_VERSION="v1.13.0"
          BATS_SHA256="a85e12b8828271a152b338ca8109aa23493b57950987c8e6dff97ba492772ff3"
          curl -sSL "https://github.com/bats-core/bats-core/archive/refs/tags/${BATS_VERSION}.tar.gz" -o bats.tar.gz
          echo "${BATS_SHA256}  bats.tar.gz" | sha256sum -c -
          tar -xzf bats.tar.gz
          sudo "./bats-core-${BATS_VERSION#v}/install.sh" /usr/local
          bats --version

      - name: GIP bats preflight
        run: bats tests/agtoosa.bats -f "GIP-"

      - name: Dry-run publish manifest
        run: bash scripts/agtoosa-issues-sync.sh --dry-run --path .

      - name: Sync GitHub Issues from Master-Plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/agtoosa-issues-sync.sh --path .

      - name: Commit README roadmap if changed
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync AGTOOSA-ROADMAP from Master-Plan [skip ci]"
          git push
