<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-label="AgToosa lifecycle: Spec, Build, Review, Ship">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="720" height="405" fill="url(#bg)" rx="16"/>
  <rect width="720" height="405" fill="url(#glow)" rx="16">
    <animate attributeName="x" values="-720;720;-720" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="360" y="52" text-anchor="middle" fill="#e0e7ff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700">AgToosa</text>
  <text x="360" y="82" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Spec � Build � Review � Ship</text>
  <g font-family="ui-monospace,monospace" font-size="13" fill="#f8fafc">
    <rect x="48" y="300" width="624" height="36" rx="8" fill="#0f172a" opacity="0.85"/>
    <text x="64" y="323" fill="#22d3ee">
      <tspan>/agtoosa-spec</tspan>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="220" y="323" fill="#64748b">�</text>
    <text x="250" y="323" fill="#34d399" opacity="0">
      spec.md 
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.45;0.85;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
  <g transform="translate(80,120)">
    <g>
      <rect width="120" height="56" rx="12" fill="#0284c7"/>
      <text x="60" y="34" text-anchor="middle" fill="#fff" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="600">Spec</text>
      <animate attributeName="opacity" values="0.4;1;1;0.4" keyTimes="0;0.15;0.85;1" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(150,0)">
      <rect width="120" height="56" rx="12" fill="#059669"/>
      <text x="60" y="34" text-anchor="middle" fill="#fff" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="600">Build</text>
      <animate attributeName="opacity" values="0.4;0.4;1;1;0.4" keyTimes="0;0.2;0.35;0.85;1" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(300,0)">
      <rect width="120" height="56" rx="12" fill="#d97706"/>
      <text x="60" y="34" text-anchor="middle" fill="#fff" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="600">Review</text>
      <animate attributeName="opacity" values="0.4;0.4;0.4;1;1;0.4" keyTimes="0;0.35;0.5;0.65;0.85;1" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(450,0)">
      <rect width="120" height="56" rx="12" fill="#dc2626"/>
      <text x="60" y="34" text-anchor="middle" fill="#fff" font-family="ui-sans-serif,sans-serif" font-size="14" font-weight="600">Ship</text>
      <animate attributeName="opacity" values="0.4;0.4;0.4;0.4;1;1;0.4" keyTimes="0;0.5;0.65;0.75;0.85;0.95;1" dur="4s" repeatCount="indefinite"/>
    </g>
    <path d="M120 28 H150 M270 28 H300 M420 28 H450" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="360" y="368" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif,sans-serif" font-size="15" font-weight="600">
    Verify. Don't trust the chat.
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
